name: Consume approved canonical CLI
description: "Run only from the fresh explicitly pinned ENGINE checkout, before consumer checkout; requires job-specific actions read and canonical producer context env."
outputs:
  verified:
    description: "Local step completion only, not an authorization token for another job"
    value: ${{ steps.receive.outputs.verified }}
runs:
  using: composite
  steps:
    - name: Retain approved engine and admit original delivery context
      shell: /bin/bash --noprofile --norc -peuo pipefail {0}
      run: /bin/bash -p "$GITHUB_ACTION_PATH/../../../scripts/ci/canonical-consumer.sh" prepare
    - name: Read fresh native metadata with this job's token
      shell: /bin/bash --noprofile --norc -peuo pipefail {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        export PATH=/usr/bin:/bin
        unset GH_DEBUG
        gh api --hostname "${GITHUB_SERVER_URL#https://}" \
          "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT_ID" >"$RUNNER_TEMP/forge-ci-canonical-metadata.json"
    - name: Admit exact metadata before extraction
      shell: /bin/bash --noprofile --norc -peuo pipefail {0}
      run: /bin/bash -p "$RUNNER_TEMP/forge-ci-approved-engine/scripts/ci/canonical-consumer.sh" admit
    - name: Download only the original canonical ID
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ env.PRODUCER_ARTIFACT_ID }}
        path: ${{ runner.temp }}/forge-ci-canonical-${{ github.run_id }}-${{ github.run_attempt }}
        merge-multiple: true
    - name: Verify raw bytes and bootstrap before installing a launcher
      id: receive
      shell: /bin/bash --noprofile --norc -peuo pipefail {0}
      run: /bin/bash -p "$RUNNER_TEMP/forge-ci-approved-engine/scripts/ci/canonical-consumer.sh" receive

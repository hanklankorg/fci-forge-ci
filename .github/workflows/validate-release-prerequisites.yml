# Release Prerequisites Validator
# 
# Purpose: Runs selected release preflight checks before build and publish jobs.
# It validates release refs and forge access, checks plan-gated credential
# presence, and reports configuration issues early.
#
# How it works:
# 1. Validates ref type, release-tag format, uniqueness, and commit reachability
# 2. Checks the tag signature and optionally enforces a committed signer allowlist
# 3. Probes the release token and bot access to the target repository
# 4. Checks GPG public-key and Maven Central credential presence when required
# 5. Runs applicable Cargo and JVM reproducibility preflight checks
# 6. Generates a validation and secret-presence summary
#
# Security controls:
# - Refuses pull-request context before release secrets are accessed
# - Keeps secret values in environment variables and reports only status
# - Enforces the signer allowlist when require-allowlisted-signer is enabled
# - Maven and GPG preflights are presence/import checks, not remote registry
#   authentication or key-expiration probes
#
# Required Secrets (depending on configuration):
#   RELEASE_TOKEN: For version bump/release operations
#   RELEASE_GPG_PRIVATE_KEY: Only when artifact or git-object signing resolves to GPG
#   RELEASE_GPG_PASSPHRASE: Passphrase for that GPG key
#   RELEASE_GPG_PUBLIC_KEY: For tag/public-key validation
#   MAVEN_CENTRAL_USERNAME: Presence-checked for Maven Central publishing
#   MAVEN_CENTRAL_PASSWORD: Presence-checked for Maven Central publishing
#
# Required Permissions:
#   contents: read   # Read version files
#
# Usage:
# Called as the first step in release-orchestrator.yml. The orchestrator
# passes typed plan JSON plus plan-derived booleans for target-specific
# prerequisite gates.
name: Validate Release Prerequisites
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      require-canonical-bootstrap: {type: boolean, required: false, default: false}
      canonical-artifact-id: {type: string, required: false, default: ""}
      canonical-artifact-name: {type: string, required: false, default: ""}
      canonical-producer-run-id: {type: string, required: false, default: ""}
      canonical-producer-run-attempt: {type: string, required: false, default: ""}
      canonical-producer-engine-repository: {type: string, required: false, default: ""}
      canonical-producer-engine-commit: {type: string, required: false, default: ""}
      canonical-producer-result: {type: string, required: false, default: ""}
      enforce-reproducible-builds:
        description: "Enforcement setting: false reports missing reproducible-build settings without failing; the check still runs. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
        type: boolean
        required: false
        default: false
      config-plan-json:
        description: "Typed config-plan-json emitted by config parse-artifacts."
        required: true
        type: string
      has-cargo-publish-target:
        description: "Whether Cargo prerequisite checks should run. True when any cargo artefact is planned (either build-mode)."
        required: false
        default: false
        type: boolean
      publish-stage-plan-json:
        description: "Typed publish-stage plan used for per-artifact prerequisite checks."
        required: true
        type: string
      has-maven-central-publish-target:
        description: "Whether Maven Central credential checks should run."
        required: false
        default: false
        type: boolean
      has-jvm-artefact:
        description: "Whether the plan includes a Maven/Gradle/Gradle-Android artefact. Enables the required per-artifact JVM reproducibility preflight."
        required: false
        default: false
        type: boolean
      container-registry:
        description: "Container registry"
        required: false
        default: "ghcr.io"
        type: string
      sign-artifacts:
        description: "Whether release artifacts will be signed by the configured backend"
        required: false
        default: true
        type: boolean
      require-allowlisted-signer:
        description: "Require the tag signer to be allowlisted in .forge-ci/allowed_signers (SSH) or .forge-ci/allowed_gpg_keys.asc (GPG). When true, a missing/empty allowlist or an unverifiable signature fails closed with EX_NOPERM (77)."
        required: false
        default: false
        type: boolean
      branch:
        description: "Explicit target branch for release validation"
        required: true
        type: string
      authorized-source-sha:
        description: "Immutable release-request commit to validate"
        required: true
        type: string
      runtime-image:
        description: "forge-ci runtime image. Empty uses the image of the resolved forge-ci version."
        required: false
        default: ""
        type: string
      forge-ci-binary-ref:
        description: "forge-ci release tag or commit whose runtime image the jobs run in; empty resolves the current stable release tag"
        required: false
        default: ""
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    # This is the subset of release secrets that the preflight exercises or
    # reports. Declaring a secret here does not imply remote credential
    # validation.
    secrets:
      MAVEN_CENTRAL_USERNAME:
        description: "Sonatype OSSRH portal username (presence-checked for Maven Central publishing)"
        required: false
      MAVEN_CENTRAL_PASSWORD:
        description: "Sonatype OSSRH portal token"
        required: false
      NPM_TOKEN:
        description: "npm registry publish token"
        required: false
      RELEASE_GPG_PRIVATE_KEY:
        description: "Armored OpenPGP private key used by `release sign`"
        required: false
      RELEASE_GPG_PASSPHRASE:
        description: "Passphrase for RELEASE_GPG_PRIVATE_KEY"
        required: false
      RELEASE_GPG_PUBLIC_KEY:
        description: "Public GPG verification material, required only when GPG is selected"
        required: false
      RELEASE_TOKEN:
        description: "Token with contents:write for release creation"
        required: false
      CODE_SCANNING_TOKEN:
        description: "Token with security-events:write for SARIF upload"
        required: false
    outputs:
      binding-run-id:
        description: "Run captured by the original prerequisite validation job"
        value: ${{ jobs.validate.outputs.binding-run-id }}
      binding-run-attempt:
        description: "Attempt captured by the original prerequisite validation job"
        value: ${{ jobs.validate.outputs.binding-run-attempt }}
      existing-release-sha:
        description: "Verified existing final-tag commit for an exact-tag recovery, otherwise empty"
        value: ${{ jobs.validate.outputs.existing-release-sha }}
permissions:
  contents: read # Default permission; individual jobs declare additions.
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
  validate:
    needs: [resolve-bootstrap]
    name: "Check: release request"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Canonical metadata/download; intentional read-only native increase.
    outputs:
      binding-run-id: ${{ github.run_id }}
      binding-run-attempt: ${{ github.run_attempt }}
      existing-release-sha: ${{ steps.prerequisites.outputs.existing-release-sha }}
    container:
      image: ${{ inputs['runtime-image'] || needs.resolve-bootstrap.outputs['runtime-image'] }}
    # ============================================================================
    # This job runs the selected release preflight checks:
    #   1. Tag - format, signature, uniqueness, and commit availability
    #   2. Authorization - optional signer allowlist and forge token access
    #   3. Plan gates - GPG/Maven presence plus Cargo/JVM checks
    #   4. Summary - validator outcomes and configured-secret status
    # ============================================================================
    steps:
      - name: Require original canonical success and approved identity
        if: ${{ inputs['require-canonical-bootstrap'] }}
        shell: /bin/bash --noprofile --norc -peuo pipefail {0}
        env:
          ENGINE_REPOSITORY: ${{ needs.resolve-bootstrap.outputs.forge-ci-repository }}
          ENGINE_COMMIT: ${{ inputs['forge-ci-binary-ref'] }}
          ENGINE_ORIGIN: ${{ github.server_url }}/${{ needs.resolve-bootstrap.outputs.forge-ci-repository }}
          RUNTIME_IMAGE: ${{ inputs['runtime-image'] }}
          PRODUCER_ARTIFACT_ID: ${{ inputs['canonical-artifact-id'] }}
          PRODUCER_ARTIFACT_NAME: ${{ inputs['canonical-artifact-name'] }}
          PRODUCER_RUN_ID: ${{ inputs['canonical-producer-run-id'] }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs['canonical-producer-run-attempt'] }}
          PRODUCER_ENGINE_REPOSITORY: ${{ inputs['canonical-producer-engine-repository'] }}
          PRODUCER_ENGINE_COMMIT: ${{ inputs['canonical-producer-engine-commit'] }}
          CANONICAL_PRODUCER_RESULT: ${{ inputs['canonical-producer-result'] }}
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANONICAL_PRODUCER_RESULT" == success && "$PRODUCER_RUN_ID" == "$GITHUB_RUN_ID" && "$PRODUCER_RUN_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]]
          [[ "$ENGINE_REPOSITORY" =~ ^[A-Za-z0-9_-][A-Za-z0-9_.-]*/[A-Za-z0-9_-][A-Za-z0-9_.-]*$ && "$ENGINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCER_ENGINE_REPOSITORY" == "$ENGINE_REPOSITORY" && "$PRODUCER_ENGINE_COMMIT" == "$ENGINE_COMMIT" ]]
          [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ARTIFACT_NAME" == "forge-ci-canonical-linux-amd64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ENGINE_COMMIT" ]]
          [[ "$RUNTIME_IMAGE" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SERVER_URL" =~ ^https://[^/?#@[:space:]]+$ && "$ENGINE_ORIGIN" == "$GITHUB_SERVER_URL/$ENGINE_REPOSITORY" ]]
          for variable in ENGINE_REPOSITORY ENGINE_COMMIT ENGINE_ORIGIN RUNTIME_IMAGE PRODUCER_ARTIFACT_ID PRODUCER_ARTIFACT_NAME PRODUCER_RUN_ID PRODUCER_RUN_ATTEMPT PRODUCER_ENGINE_REPOSITORY PRODUCER_ENGINE_COMMIT CANONICAL_PRODUCER_RESULT; do
            printf '%s=%s\n' "$variable" "${!variable}" >>"$GITHUB_ENV"
          done
      - name: Checkout only the approved engine before consumer or private steps
        if: ${{ inputs['require-canonical-bootstrap'] }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ env.ENGINE_COMMIT }}
          path: _forge_ci_bootstrap
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Consume canonical CLI from the independently pinned engine checkout
        id: canonical-bootstrap
        if: ${{ inputs['require-canonical-bootstrap'] }}
        uses: ./_forge_ci_bootstrap/.github/actions/consume-canonical-cli
      # Defense-in-depth: refuse PR-context triggers. This job handles release
      # token, GPG, Maven Central, and secret-presence metadata and must never
      # run with PR-HEAD code. forge-ci is pre-baked.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: forge-ci validate event-context
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs['authorized-source-sha'] }}
          CHECKOUT_FETCH_ALL_REFS: "true" # full history + all tags (tag-signature checks)
        run: forge-ci platform checkout
      - name: Debug - List checked out files
        env:
          ACTION_REPOSITORY: ${{ github.action_repository }}
          ACTION_REF: ${{ github.action_ref }}
        run: forge-ci platform debug-workspace
      - name: Import GPG key
        id: import-gpg
        if: ${{ (inputs['sign-artifacts'] && fromJSON(inputs['config-plan-json']).sign.imports_gpg_key) || fromJSON(inputs['config-plan-json']).git_signing.imports_gpg_key }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GIT_USER_SIGNINGKEY: "true"
          GIT_COMMIT_GPGSIGN: "true"
          FORGE_CI_GIT_CONFIG_GLOBAL: "true"
        run: forge-ci release gpg import
      # All prerequisite validators run concurrently inside one Go
      # invocation. The orchestrator owns ordering, output capture, and
      # aggregate failure reporting. Replaces ~10 sequential workflow
      # steps with one — saves ~30-50s wall-clock per release run.
      - name: Validate Release Prerequisites
        id: prerequisites
        env:
          ADMIN_REPRODUCIBLE_BUILDS: ${{ inputs['enforce-reproducible-builds'] }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          TARGET_BRANCH: ${{ inputs.branch }}
          REPOSITORY: ${{ github.repository }}
          REQUIRE_ALLOWLISTED_SIGNER: ${{ inputs['require-allowlisted-signer'] }}
          SIGN_ARTIFACTS: ${{ inputs['sign-artifacts'] }}
          REQUIRES_GPG_SIGNING: ${{ (inputs['sign-artifacts'] && fromJSON(inputs['config-plan-json']).sign.imports_gpg_key) || fromJSON(inputs['config-plan-json']).git_signing.imports_gpg_key }}
          HAS_MAVEN_CENTRAL_TARGET: ${{ inputs['has-maven-central-publish-target'] }}
          HAS_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
          HAS_CARGO_TARGET: ${{ inputs['has-cargo-publish-target'] }}
          HAS_JVM_TARGET: ${{ inputs['has-jvm-artefact'] }}
          PUBLISH_STAGE_PLAN_JSON: ${{ inputs['publish-stage-plan-json'] }}
          CONFIG_PLAN_JSON: ${{ inputs['config-plan-json'] }}
          # Secrets stay in env — never passed via argv.
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: forge-ci validate prerequisites --enforce-reproducible-builds="$ADMIN_REPRODUCIBLE_BUILDS"
      # Secrets-presence summary stays as a separate step — it reports a
      # different shape (which secrets are configured, regardless of
      # whether they were exercised by the validators above).
      - name: Generate Validation Summary
        if: ${{ always() && (!inputs['require-canonical-bootstrap'] || steps.canonical-bootstrap.outputs.verified == 'true') }}
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          CONFIG_PLAN_JSON: ${{ inputs['config-plan-json'] }}
          CONTAINER_REGISTRY: ${{ inputs['container-registry'] }}
          SIGN_ARTIFACTS: ${{ inputs['sign-artifacts'] }}
          REQUIRE_ALLOWLISTED_SIGNER: ${{ inputs['require-allowlisted-signer'] }}
          JOB_STATUS: ${{ job.status }}
          HAS_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
          HAS_RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE != '' }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          HAS_RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY != '' }}
          HAS_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' }}
          HAS_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD != '' }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          HAS_CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN != '' }}
        run: forge-ci report status prerequisites
      - name: Cleanup GPG key
        if: ${{ always() && (!inputs['require-canonical-bootstrap'] || steps.canonical-bootstrap.outputs.verified == 'true') && ((inputs['sign-artifacts'] && fromJSON(inputs['config-plan-json']).sign.imports_gpg_key) || fromJSON(inputs['config-plan-json']).git_signing.imports_gpg_key) }}
        env:
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
        run: forge-ci release gpg cleanup

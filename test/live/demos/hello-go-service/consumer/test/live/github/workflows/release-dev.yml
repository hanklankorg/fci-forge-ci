# A development snapshot of a branch: Forge CI's snapshot orchestrator builds
# the service image from the Containerfile, which runs go build, and
# publishes it to this repository's container package, without a release, a
# tag or a change to the branch. Dispatched by hand, named the branch to
# snapshot.
name: Development Snapshot

on:
  workflow_dispatch:
    inputs:
      source-branch:
        description: "Branch to snapshot; empty snapshots the branch the workflow runs on"
        required: false
        default: ""
        type: string

concurrency:
  group: snapshot-${{ inputs.source-branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    uses: diggsweden/forge-ci/.github/workflows/release-snapshot-orchestrator.yml@v0.90.0
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      branch: ${{ inputs.source-branch || github.ref_name }}
      forge-ci-binary-ref: v0.90.0
      artifacts-config: .forge-ci/artifacts.yml
      # The trial renders runtime-image and canonical-builder-image by digest,
      # as the orchestrator admits them.
      runtime-image: ghcr.io/diggsweden/forge-ci-runtime-base:v0.90.0
      canonical-builder-image: ghcr.io/diggsweden/forge-ci-runtime-go-1.27:v0.90.0
      runtime-image-full: ghcr.io/diggsweden/forge-ci-runtime:v0.90.0
      runtime-image-go: ghcr.io/diggsweden/forge-ci-runtime-go-1.27:v0.90.0

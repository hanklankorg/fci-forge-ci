# Separate native GPG artifact profile. The ordinary trial supplies its
# disposable key; release-create-github signs real product files as .asc.
# This case does not claim offered-bundle coverage: use release.yml for that.
name: Native GPG release
on:
  push:
    tags:
      - "release-request/v*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: diggsweden/forge-ci/.github/workflows/release-orchestrator.yml@v0.90.0
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
    with:
      branch: main
      forge-ci-binary-ref: v0.90.0
      artifacts-config: .forge-ci/artifacts-gpg.yml
      changelog-creator: git-cliff
      release-publisher: github-cli
      runtime-image: ghcr.io/diggsweden/forge-ci-runtime-base:v0.90.0
      runtime-image-full: ghcr.io/diggsweden/forge-ci-runtime:v0.90.0
      runtime-image-go: ghcr.io/diggsweden/forge-ci-runtime-go-1.27:v0.90.0
      release.signartifacts: true
      release.attachartifacts: release-artifacts/*/my-cli-*
